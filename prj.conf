CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=32768

CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y

CONFIG_LOG_CMDS=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=3

# Enable RTT
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=8192
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
CONFIG_SEGGER_RTT_PRINTF_BUFFER_SIZE=8192
CONFIG_RTT_CONSOLE=y

# Enable log on RTT
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_BUFFER=1
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_BACKEND_RTT_MODE_BLOCK=n
CONFIG_LOG_BACKEND_RTT_BUFFER_SIZE=8192
CONFIG_LOG_BACKEND_UART=n

# Log settings
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_OVERFLOW=y
CONFIG_LOG_BLOCK_IN_THREAD=n
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD=y

# Shell settings
CONFIG_PRINTK=y
CONFIG_PRINTK_SYNC=y
CONFIG_SHELL=y
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_MINIMAL=n
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_SHELL_BYPASS_READ_BUF_SIZE=512
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_STATS=y
CONFIG_STATS_SHELL=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# Disable uart
CONFIG_TFM_SECURE_UART=n
CONFIG_UART_CONSOLE=n
CONFIG_TFM_LOG_LEVEL_SILENCE=y

CONFIG_REGULATOR_LOG_LEVEL_ERR=y
CONFIG_DISPLAY_LOG_LEVEL_ERR=y
CONFIG_SENSOR_LOG_LEVEL_ERR=y

# Enable file system
CONFIG_FILE_SYSTEM=y
CONFIG_DISK_ACCESS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
# The audio pump thread reads files while the main thread does
# metadata/art scans: FatFs needs its per-volume mutex
CONFIG_FS_FATFS_REENTRANT=y
# pump song + APIC scan + art data handle, with shell headroom
CONFIG_FS_FATFS_NUM_FILES=6

# Enable audio stuff
CONFIG_AUDIO_CODEC_LOG_LEVEL_DBG=y
CONFIG_AUDIO_CODEC_TAD5X12=y
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_NRFX_I2S=y
CONFIG_I2S=y
CONFIG_I2S_LOG_LEVEL_ERR=y
CONFIG_I2S_NRFX_TX_BLOCK_COUNT=16
CONFIG_I2S_NRFX_RX_BLOCK_COUNT=4

# Drivers
CONFIG_LED=y
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_MFD=y
CONFIG_DISPLAY=y
CONFIG_REGULATOR=y
CONFIG_SENSOR=y
CONFIG_AMS_AS5600=y

# Use the vendored SSD16XX driver (gen2 partial refresh fix) instead
# of the in-tree one. See modules/display_ssd16xx/Kconfig.
CONFIG_SSD16XX=n
CONFIG_SSD16XX_EPD=y

# Codec init must run after the dac_avdd fixed regulator (priority 75)
CONFIG_AUDIO_CODEC_INIT_PRIORITY=80

# LVGL CONFIG
CONFIG_LVGL=y
# LVGL's I1 buffer marks white pixels as 1; without this the mono
# transform renders the screen color-inverted on EPD panels
CONFIG_LV_Z_COLOR_MONO_HW_INVERSION=y
CONFIG_LV_Z_SHELL=y
CONFIG_LV_Z_LVGL_MUTEX=y
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_VDB_SIZE=64
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_Z_FULL_REFRESH=n
# Flush synchronously: e-ink updates are slow anyway, and it keeps
# display_blanking_on/off() calls in the app race-free with flushes
CONFIG_LV_Z_FLUSH_THREAD=n
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_LEVEL_WARN=y

# Debug stack corruption
CONFIG_THREAD_STACK_INFO=y
CONFIG_STACK_SENTINEL=y
CONFIG_ISR_STACK_SIZE=8192

# Caches on: without I-cache, XIP code runs a fraction of speed and
# MP3 decode can't sustain realtime. nRF53's cache is system-coherent
# for EasyDMA masters, and the I2S slab is owned end-to-end now.
CONFIG_NRF_ENABLE_CACHE=y

# Logging thread stack (deferred logging can be stack-heavy)
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# Enable LVGL widgets
CONFIG_LV_CONF_MINIMAL=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_LABEL_TEXT_SELECTION=y
CONFIG_LV_LABEL_LONG_TXT_HINT=y
CONFIG_LV_USE_LINE=y

# fonts
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_24=y

# image widget + baseline JPEG decoder for the album art player view
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_TJPGD=y
